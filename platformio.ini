#include <Arduino.h>
#include <Wire.h>
#include <BleGamepad.h>
#include <NimBLEDevice.h>
#include "PCF8574.h"

// Controller Name shown on Android Bluetooth
BleGamepad bleGamepad("ESP32S3-ProPad", "DIY-Console", 100);
PCF8574 pcf8574(0x20); // A0, A1, A2 connected to GND
bool pcfConnected = false;

// 1. 8-Way D-Pad Pins (Active LOW)
#define DPAD_UP    5
#define DPAD_DOWN  6
#define DPAD_LEFT  7
#define DPAD_RIGHT 21

// 2. Safe Action & Bumper Pins (Avoids strapping pins 0, 45, 46!)
const int actionPins = {
  38, // A  (Cross)
  15, // B  (Circle)  <-- Moved from GPIO 45
  16, // X  (Square)  <-- Moved from GPIO 46
  47, // Y  (Triangle)
  48, // L1 (Left Bumper)
  17  // R1 (Right Bumper / Fire) <-- Moved from GPIO 0
};

const int actionBtns = {
  BUTTON_1, // A
  BUTTON_2, // B
  BUTTON_4, // X
  BUTTON_5, // Y
  BUTTON_7, // L1
  BUTTON_8  // R1
};

// 3. PCF8574 Expander Pins: P0..P4 (Buttons), P5 (TTP223 Turbo), P6..P7 (L3, R3)
const int pcfBtnMap = {
  BUTTON_12, // P0: Start
  BUTTON_11, // P1: Select
  BUTTON_9,  // P2: L2
  BUTTON_10, // P3: R2
  BUTTON_13, // P4: Home / Extra
  0,         // P5: TTP223 Touch Sensor (Turbo Toggle)
  BUTTON_14, // P6: L3 (Left Stick Click)
  BUTTON_15  // P7: R3 (Right Stick Click)
};

// 4. Dual Analog Joysticks (ADC1 - Powered by 3.3V!)
#define LX_PIN 1
#define LY_PIN 2
#define RX_PIN 3
#define RY_PIN 4
#define DEADZONE 300

bool turboEnabled = false;
bool lastTouchState = false;
unsigned long lastTurboToggle = 0;
bool turboPulse = false;

int16_t mapAxis(int raw, bool invert) {
  int delta = raw - 2048;
  if (abs(delta) < DEADZONE) return 16383; // Center (0..32767)
  if (invert) delta = -delta;
  long val = map(delta, -2048, 2048, 0, 32767);
  return constrain(val, 0, 32767);
}

uint8_t readDpadHat() {
  bool u = (digitalRead(DPAD_UP) == LOW);
  bool d = (digitalRead(DPAD_DOWN) == LOW);
  bool l = (digitalRead(DPAD_LEFT) == LOW);
  bool r = (digitalRead(DPAD_RIGHT) == LOW);

  if (u && r) return DPAD_UP_RIGHT;
  if (u && l) return DPAD_UP_LEFT;
  if (d && r) return DPAD_DOWN_RIGHT;
  if (d && l) return DPAD_DOWN_LEFT;
  if (u)      return DPAD_UP;
  if (d)      return DPAD_DOWN;
  if (l)      return DPAD_LEFT;
  if (r)      return DPAD_RIGHT;
  return DPAD_CENTERED;
}

void setup() {
  Serial.begin(115200);
  delay(500);

  // Initialize I2C & verify PCF8574 is physically connected
  Wire.begin(8, 18); // SDA = GPIO 8, SCL = GPIO 18
  Wire.beginTransmission(0x20);
  if (Wire.endTransmission() == 0) {
    pcfConnected = true;
    pcf8574.begin();
    for (int i = 0; i < 8; i++) pcf8574.pinMode(i, INPUT);
    Serial.println("PCF8574 found at 0x20.");
  } else {
    Serial.println("PCF8574 not detected - skipping expander inputs.");
  }

  // Configure Direct GPIO Buttons
  pinMode(DPAD_UP, INPUT_PULLUP);
  pinMode(DPAD_DOWN, INPUT_PULLUP);
  pinMode(DPAD_LEFT, INPUT_PULLUP);
  pinMode(DPAD_RIGHT, INPUT_PULLUP);
  for (int i = 0; i < 6; i++) {
    pinMode(actionPins[i], INPUT_PULLUP);
  }

  // Configure BLE Gamepad
  BleGamepadConfiguration config;
  config.setAutoReport(false);
  config.setControllerType(CONTROLLER_TYPE_GAMEPAD);
  config.setButtonCount(16);
  config.setHatSwitchCount(1);
  config.setWhichAxes(true, true, true, false, false, true, false, false); // Left X/Y + Right X/Y

  bleGamepad.begin(&config);

  // Prevent Android BLE Reconnection / Bonding Rejections
  NimBLEDevice::setSecurityAuth(false, false, false);
  NimBLEDevice::setSecurityIOCap(BLE_HS_IO_NO_INPUT_OUTPUT);
  NimBLEDevice::setPower(ESP_PWR_LVL_P9); // Max stable Bluetooth signal

  Serial.println("BLE Controller Ready! Pair with 'ESP32S3-ProPad'");
}

void loop() {
  if (bleGamepad.isConnected()) {
    turboPulse = !turboPulse;

    // 1. Left Stick (Move) & Right Stick (360 Camera)
    bleGamepad.setAxes(
      mapAxis(analogRead(LX_PIN), false),
      mapAxis(analogRead(LY_PIN), true),
      mapAxis(analogRead(RX_PIN), false),
      0, 0,
      mapAxis(analogRead(RY_PIN), true),
      0, 0
    );

    // 2. 8-Way D-Pad Hat Switch
    bleGamepad.setHat1(readDpadHat());

    // 3. Action Buttons & Bumpers (R1 supports Turbo Fire)
    for (int i = 0; i < 6; i++) {
      bool pressed = (digitalRead(actionPins[i]) == LOW);
      if (actionBtns[i] == BUTTON_8 && turboEnabled && pressed) {
        if (turboPulse) bleGamepad.press(BUTTON_8);
        else bleGamepad.release(BUTTON_8);
      } else {
        if (pressed) bleGamepad.press(actionBtns[i]);
        else bleGamepad.release(actionBtns[i]);
      }
    }

    // 4. PCF8574 Expander Buttons + Debounced TTP223 Turbo Toggle
    if (pcfConnected) {
      for (int i = 0; i < 8; i++) {
        uint8_t state = pcf8574.digitalRead(i);
        if (i == 5) { // P5 = TTP223 Touch Sensor
          bool touched = (state == HIGH);
          if (touched && !lastTouchState && (millis() - lastTurboToggle > 350)) {
            turboEnabled = !turboEnabled;
            lastTurboToggle = millis();
            Serial.print("Turbo Mode: ");
            Serial.println(turboEnabled ? "ON" : "OFF");
          }
          lastTouchState = touched;
        } else {
          if (state == LOW) bleGamepad.press(pcfBtnMap[i]);
          else bleGamepad.release(pcfBtnMap[i]);
        }
      }
    }

    bleGamepad.sendReport();
  }
  delay(10); // 100Hz smooth polling
}
